<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kho Hình Nền iPad – Tải hình nền chất lượng cao và giao diện hiện đại.">
    <title>Kho Hình Nền iPad - Modern UI</title>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Inter:300,400,600,700");

        /* --- BIẾN CSS & CẤU HÌNH THEME (DARK / LIGHT MODE) --- */
        :root {
            --bg-color: #0f1115;
            --text-color: #f3f4f6;
            --card-bg: #1f2937;
            --card-border: #374151;
            --input-bg: #111827;
            --text-secondary: #9ca3af;
            --title-color: #e5e7eb;
            --nav-bg: rgba(31, 41, 55, 0.75);
            --nav-border: rgba(255, 255, 255, 0.15);
            --nav-item-hover: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --input-bg: #f1f5f9;
            --text-secondary: #64748b;
            --title-color: #0f172a;
            --nav-bg: rgba(255, 255, 255, 0.8);
            --nav-border: rgba(0, 0, 0, 0.1);
            --nav-item-hover: rgba(0, 0, 0, 0.05);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body, html {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px 100px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- HEADER --- */
        header { 
            text-align: center; 
            margin-bottom: 25px; 
            position: relative; 
        }

        header h1 {
            font-size: 2.5rem; 
            font-weight: 700; 
            margin-bottom: 10px;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        header p { 
            color: var(--text-secondary); 
            font-size: 1.1rem; 
        }

        /* --- LIQUID NAV (TASKBAR NỔI DƯỚI MÀN HÌNH) --- */
        .liquid-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 99px;
            border: 1px solid var(--nav-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .liquid-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.25s, transform 0.2s;
            font-family: inherit;
        }

        .liquid-nav-btn:hover {
            background: var(--nav-item-hover);
            transform: translateY(-2px);
        }

        .liquid-nav-btn.logout { color: #f87171; }

        .liquid-divider {
            width: 1px;
            height: 20px;
            background: var(--nav-border);
            margin: 0 4px;
        }

        .user-pill {
            font-size: 0.85rem;
            color: #10b981;
            font-weight: 600;
            padding: 4px 10px;
        }

        /* --- KHU VỰC UPLOAD HÌNH NỀN --- */
        .upload-section {
            background-color: var(--card-bg); 
            max-width: 600px;
            margin: 0 auto 25px auto; 
            padding: 25px; 
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 2px dashed var(--card-border); 
            text-align: center;
        }

        .upload-section h3 { margin-bottom: 15px; font-size: 1.2rem; }

        .upload-form { display: flex; flex-direction: column; gap: 12px; }

        .upload-form input[type="text"],
        .upload-form select,
        .upload-form input[type="file"] {
            padding: 10px; 
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg); 
            color: var(--text-color); 
            font-size: 0.95rem;
        }

        .submit-btn {
            background-color: #10b981; 
            color: white; 
            border: none;
            padding: 12px; 
            border-radius: 8px; 
            font-size: 1rem;
            font-weight: 600; 
            cursor: pointer;
        }

        .submit-btn:hover { background-color: #059669; }

        /* --- LỌC VÀ SẮP XẾP --- */
        .filter-sort-bar {
            max-width: 1200px; 
            margin: 0 auto 25px auto;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-wrap: wrap; 
            gap: 15px; 
            background-color: var(--card-bg);
            padding: 15px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--card-border);
        }

        .category-filters { display: flex; gap: 8px; flex-wrap: wrap; }

        .filter-btn {
            background: var(--input-bg); 
            border: 1px solid var(--card-border);
            color: var(--text-secondary); 
            padding: 6px 14px; 
            border-radius: 6px;
            font-size: 0.85rem; 
            cursor: pointer; 
            font-weight: 500;
        }

        .filter-btn.active {
            background-color: #3b82f6; 
            color: white; 
            border-color: #3b82f6;
        }

        .sort-select {
            padding: 6px 12px; 
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg); 
            color: var(--text-color);
            font-size: 0.85rem; 
            cursor: pointer;
        }

        /* --- KHO GALLERY HÌNH NỀN --- */
        .gallery {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px; 
            max-width: 1200px; 
            margin: 0 auto;
        }

        .wallpaper-card {
            background-color: var(--card-bg); 
            border-radius: 16px;
            overflow: hidden; 
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease; 
            cursor: pointer;
        }

        .wallpaper-card:hover { transform: translateY(-5px); }

        .wallpaper-card img {
            width: 100%; 
            height: 300px; 
            object-fit: cover; 
            display: block;
        }

        .wallpaper-info { padding: 12px 15px; }

        .card-header-row {
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            margin-bottom: 8px;
        }

        .wallpaper-title {
            font-size: 0.9rem; 
            font-weight: 500; 
            color: var(--title-color);
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            max-width: 110px;
        }

        .actions { display: flex; align-items: center; gap: 8px; }

        .like-btn {
            background: none; 
            border: none; 
            color: #ef4444;
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 4px;
        }

        .download-btn {
            background-color: #3b82f6; 
            color: white; 
            border: none;
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 0.8rem; 
            text-decoration: none;
        }

        .preview-tags { display: flex; gap: 6px; flex-wrap: wrap; min-height: 22px; }

        .mini-tag {
            background-color: var(--input-bg); 
            border: 1px solid var(--card-border);
            color: var(--text-secondary); 
            font-size: 0.75rem; 
            padding: 2px 8px; 
            border-radius: 6px;
        }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 30px; }

        .page-btn {
            background-color: var(--card-bg); 
            border: 1px solid var(--card-border);
            color: var(--text-color); 
            padding: 8px 14px; 
            border-radius: 6px;
            cursor: pointer; 
            font-weight: 600;
        }

        .page-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }

        /* --- MODAL XEM CHI TIẾT & HASHTAG --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }

        .modal-body {
            background-color: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px;
            max-width: 500px; 
            width: 100%; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            position: relative; 
            max-height: 95vh; 
            overflow-y: auto;
        }

        .modal-body img.preview-img {
            width: 100%; 
            max-height: 50vh; 
            object-fit: contain;
            border-radius: 12px; 
            margin-bottom: 15px;
        }

        .reaction-tags-container {
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            width: 100%;
            margin-top: 10px; 
            padding-top: 10px; 
            border-top: 1px solid var(--card-border);
        }

        .reaction-tag {
            background-color: var(--input-bg); 
            border: 1px solid var(--card-border);
            color: var(--text-color); 
            padding: 6px 12px; 
            border-radius: 10px;
            font-size: 0.85rem; 
            cursor: pointer; 
            display: flex; 
            align-items: center;
            gap: 6px; 
            transition: all 0.2s;
        }

        .reaction-tag:hover { border-color: #3b82f6; }
        .reaction-tag.reacted {
            background-color: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6; 
            color: #60a5fa;
        }

        .add-tag-trigger {
            background-color: var(--input-bg); 
            border: 1px dashed var(--card-border);
            color: var(--text-secondary); 
            padding: 6px 12px; 
            border-radius: 10px;
            font-size: 0.85rem; 
            cursor: pointer; 
            display: flex; 
            align-items: center;
            justify-content: center; 
            font-weight: bold;
        }

        .add-tag-input-box { display: none; width: 100%; margin-top: 10px; gap: 8px; }
        .add-tag-input-box input {
            flex: 1; padding: 8px; border-radius: 8px;
            border: 1px solid var(--card-border); background-color: var(--input-bg);
            color: var(--text-color); font-size: 0.85rem;
        }
        .add-tag-input-box button {
            padding: 8px 14px; border-radius: 8px; background-color: #3b82f6;
            color: white; border: none; cursor: pointer; font-weight: 600;
        }

        .close-modal { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            color: var(--text-color); 
            font-size: 2rem; 
            cursor: pointer; 
            z-index: 10; 
        }

        /* --- MODAL LOGIN / REGISTER VỚI VIDEO BACKGROUND --- */
        .animated-auth-modal {
            display: none; 
            position: fixed; 
            top: 0; left: 0;
            width: 100vw; 
            height: 100vh; 
            z-index: 2000;
            overflow: hidden;
        }

        .vid-container {
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
        }

        .bgvid {
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh;
            object-fit: cover; 
            z-index: 1;
        }

        .overlay {
            position: absolute; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh;
            background: linear-gradient(120deg, rgba(30,30,40,0.7) 60%, rgba(0, 89, 255, 0.2) 100%);
            z-index: 2;
        }

        .inner-container {
            position: relative; 
            z-index: 3; 
            height: 100vh;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .box {
            background: rgba(23, 23, 26, 0.82); 
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 #000a, 0 1.5px 8px 0 #0084ff55;
            padding: 38px 32px 28px 32px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-width: 320px; 
            max-width: 90vw;
            backdrop-filter: blur(8px); 
            border: 1.5px solid #3f90fa; 
            position: relative;
        }

        .box h1 { 
            color: #fff; 
            margin-bottom: 22px; 
            font-size: 1.5rem; 
            letter-spacing: 1px; 
            text-align: center; 
        }

        .box input[type="text"], 
        .box input[type="email"], 
        .box input[type="password"] {
            width: 100%; 
            padding: 12px 14px; 
            margin-bottom: 16px; 
            border: none;
            border-radius: 8px; 
            background: #232526; 
            color: #fff; 
            font-size: 1rem;
            outline: none; 
            transition: box-shadow 0.2s, border 0.2s;
            box-shadow: 0 1px 4px #fd0000; 
            border: 1.5px solid #444;
        }

        .box input[type="text"]:focus, 
        .box input[type="email"]:focus, 
        .box input[type="password"]:focus {
            border: 1.5px solid #3f90fa; 
            box-shadow: 0 0 0 2px #3f90fa55;
        }

        .box button.action-btn {
            width: 100%; 
            padding: 12px 0;
            background: linear-gradient(90deg, #3f90fa 60%, #fc0101 100%);
            color: #232526; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem;
            font-weight: 600; 
            cursor: pointer; 
            margin-bottom: 12px;
            transition: background 0.2s, color 0.2s; 
            box-shadow: 0 2px 8px #3f90fa33;
            letter-spacing: 0.5px;
        }

        .box button.action-btn:hover {
            background: linear-gradient(90deg, #3f90fa 0%, #fc0101 100%); 
            color: #fff;
        }

        .box p { color: #fff; font-size: 1rem; margin: 0; }

        .signup-toggle {
            color: #3f90fa; 
            cursor: pointer; 
            font-weight: 600; 
            margin-left: 4px;
            transition: text-decoration 0.2s;
        }

        .signup-toggle:hover { text-decoration: underline; }

        .close-animated-modal {
            position: absolute; 
            top: 10px; 
            right: 15px; 
            color: #fff;
            font-size: 1.8rem; 
            cursor: pointer; 
            z-index: 10;
        }

        @media (max-width: 600px) {
            .box { min-width: 90vw; padding: 24px 8vw 18px 8vw; }
            .box h1 { font-size: 1.1rem; }
            .liquid-nav { width: 92%; justify-content: space-around; padding: 6px 10px; }
            .liquid-nav-btn { padding: 6px 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- TRANG HEADER -->
    <header>
        <h1>Kho Hình Nền iPad</h1>
        <p>Tuyển tập hình nền chất lượng cao dành cho màn hình iPad của bạn.</p>
    </header>

    <!-- THANH NAV NỔI BO TRÒN (LIQUID NAV BAR) -->
    <nav class="liquid-nav">
        <button class="liquid-nav-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">🏠 Trang chủ</button>
        <button class="liquid-nav-btn" onclick="toggleTheme()">☀️ / 🌙 Giao diện</button>
        <div class="liquid-divider"></div>
        <span class="user-pill" id="userInfo" style="display: none;"></span>
        <button class="liquid-nav-btn" id="btnLoginOpen" onclick="openAnimatedAuthModal('login')">Đăng nhập</button>
        <button class="liquid-nav-btn" id="btnRegisterOpen" onclick="openAnimatedAuthModal('register')">Đăng ký</button>
        <button class="liquid-nav-btn logout" id="btnLogout" style="display: none;" onclick="logout()">Thoát</button>
    </nav>

    <!-- KHU VỰC ĐĂNG ẢNH HÌNH NỀN -->
    <div class="upload-section">
        <h3>Chia sẻ hình nền mới của bạn</h3>
        <form class="upload-form" id="uploadForm">
            <input type="text" id="imageTitle" placeholder="Nhập tên hình nền..." required>
            <select id="imageCategory" required>
                <option value="phong-canh">Phong cảnh</option>
                <option value="hien-dai">Hiện đại</option>
                <option value="truu-tuong">Trừu tượng</option>
                <option value="toi-gian">Tối giản</option>
            </select>
            <input type="file" id="imageFile" accept="image/png, image/jpeg, image/webp" required>
            <button type="submit" class="submit-btn">Đăng lên kho lưu trữ</button>
        </form>
    </div>

    <!-- THANH BỘ LỌC VÀ SẮP XẾP -->
    <div class="filter-sort-bar">
        <div class="category-filters">
            <button class="filter-btn active" onclick="filterCategory('all', this)">Tất cả</button>
            <button class="filter-btn" onclick="filterCategory('phong-canh', this)">Phong cảnh</button>
            <button class="filter-btn" onclick="filterCategory('hien-dai', this)">Hiện đại</button>
            <button class="filter-btn" onclick="filterCategory('truu-tuong', this)">Trừu tượng</button>
            <button class="filter-btn" onclick="filterCategory('toi-gian', this)">Tối giản</button>
        </div>
        <select class="sort-select" id="sortSelect" onchange="changeSortMethod()">
            <option value="latest">Mới nhất</option>
            <option value="oldest">Cũ nhất</option>
            <option value="trending">🔥 Nhiều yêu thích nhất</option>
        </select>
    </div>

    <!-- KHU VỰC HIỂN THỊ DANH SÁCH ẢNH -->
    <div class="gallery" id="gallery"></div>
    <div class="pagination" id="pagination"></div>

    <!-- MODAL ĐĂNG NHẬP / ĐĂNG KÝ VỚI VIDEO NỀN -->
    <div class="animated-auth-modal" id="animatedAuthModal">
        <div class="vid-container">
            <video id="Video1" class="bgvid back" autoplay muted loop playsinline>
                <source src="https://v1.pinimg.com/videos/iht/720p/a7/c6/35/a7c6356f7ec443a65aa9cfe6f8549168.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="inner-container">
                <div class="box">
                    <span class="close-animated-modal" onclick="closeAnimatedAuthModal()">&times;</span>
                    
                    <div id="loginSection" style="width: 100%;">
                        <h1>Login</h1>
                        <input type="text" id="animLoginUser" placeholder="Username" autocomplete="username"/>
                        <input type="password" id="animLoginPass" placeholder="Password" autocomplete="current-password"/>
                        <button class="action-btn" onclick="handleAnimLogin()">Login</button>
                        <p style="text-align: center;">Not a member? <span class="signup-toggle" onclick="switchAuthMode('register')">Sign Up</span></p>
                    </div>

                    <div id="registerSection" style="width: 100%; display: none;">
                        <h1>Sign Up</h1>
                        <input type="text" id="animRegUser" placeholder="Username" autocomplete="username"/>
                        <input type="email" id="animRegEmail" placeholder="Email" autocomplete="email"/>
                        <input type="password" id="animRegPass" placeholder="Password" autocomplete="new-password"/>
                        <button class="action-btn" onclick="handleAnimRegister()">Sign Up</button>
                        <p style="text-align: center;">Already a member? <span class="signup-toggle" onclick="switchAuthMode('login')">Login</span></p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- MODAL XEM CHI TIẾT HÌNH NỀN & HASHTAG -->
    <div class="modal" id="imageModal" onclick="closeModalOnOutside(event, 'imageModal')">
        <div class="modal-body">
            <span class="close-modal" onclick="closeModal('imageModal')">&times;</span>
            <img class="preview-img" id="modalImg" src="" alt="Full Wallpaper">
            <h3 id="modalTitle" style="font-size: 1.1rem; margin-bottom: 10px; text-align: center; color: var(--title-color);"></h3>
            
            <div style="width: 100%; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px;">Thẻ Hashtag (Bấm để thả/hủy):</div>
            <div class="reaction-tags-container" id="modalReactionContainer"></div>

            <div class="add-tag-input-box" id="addTagInputBox">
                <input type="text" id="newTagInput" placeholder="Nhập tên hashtag (VD: #4k, #chill)...">
                <button onclick="submitNewTag()">Thêm</button>
            </div>
        </div>
    </div>

    <!-- XỬ LÝ JAVASCRIPT -->
    <script>
        let users = JSON.parse(localStorage.getItem('ipad_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('ipad_current_user')) || null;
        let activeModalWallpaperId = null;

        const defaultWallpapers = [
            { id: 1, title: "Dải màu trừu tượng 01", category: "truu-tuong", url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80", likes: 3, likedBy: [], tags: { "oled": {count: 5, users: []}, "4k": {count: 2, users: []} } },
            { id: 2, title: "Đồi núi tối giản", category: "toi-gian", url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80", likes: 8, likedBy: [], tags: { "phongcanh": {count: 8, users: []}, "chill": {count: 4, users: []} } },
            { id: 3, title: "Sóng neon huyền ảo", category: "hien-dai", url: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1200&q=80", likes: 5, likedBy: [], tags: { "neon": {count: 7, users: []}, "dark": {count: 9, users: []} } },
            { id: 4, title: "Tinh vân vũ trụ", category: "truu-tuong", url: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1200&q=80", likes: 10, likedBy: [], tags: { "vutu": {count: 15, users: []} } },
            { id: 5, title: "Đường nét kiến trúc", category: "hien-dai", url: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80", likes: 2, likedBy: [], tags: {} },
            { id: 6, title: "Hoàng hôn trên biển", category: "phong-canh", url: "https://images.unsplash.com/photo-1495954484750-af469f2f9be5?auto=format&fit=crop&w=1200&q=80", likes: 7, likedBy: [], tags: { "hoanghon": {count: 6, users: []} } }
        ];

        let storedWallpapers = JSON.parse(localStorage.getItem('ipad_wallpapers'));
        let wallpapers = (!storedWallpapers || storedWallpapers.length === 0) ? defaultWallpapers : storedWallpapers;
        localStorage.setItem('ipad_wallpapers', JSON.stringify(wallpapers));

        let currentCategory = 'all';
        let currentSort = 'latest';
        let currentPage = 1;
        const itemsPerPage = 12;

        /* Quản lý Light / Dark Mode */
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('ipad_theme', newTheme);
        }

        const savedTheme = localStorage.getItem('ipad_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        /* Cập nhật UI Tài khoản */
        function updateAuthUI() {
            const userInfoEl = document.getElementById('userInfo');
            const btnLoginOpen = document.getElementById('btnLoginOpen');
            const btnRegisterOpen = document.getElementById('btnRegisterOpen');
            const btnLogout = document.getElementById('btnLogout');

            if (currentUser) {
                userInfoEl.textContent = `👤 ${currentUser.username}`;
                userInfoEl.style.display = 'inline-block';
                btnLoginOpen.style.display = 'none';
                btnRegisterOpen.style.display = 'none';
                btnLogout.style.display = 'inline-block';
            } else {
                userInfoEl.style.display = 'none';
                btnLoginOpen.style.display = 'inline-block';
                btnRegisterOpen.style.display = 'inline-block';
                btnLogout.style.display = 'none';
            }
        }

        /* Quản lý Modal Đăng nhập / Đăng ký */
        function openAnimatedAuthModal(mode) {
            switchAuthMode(mode);
            document.getElementById('animatedAuthModal').style.display = 'block';
        }

        function closeAnimatedAuthModal() {
            document.getElementById('animatedAuthModal').style.display = 'none';
        }

        function switchAuthMode(mode) {
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            if (mode === 'register') {
                loginSec.style.display = 'none';
                regSec.style.display = 'block';
            } else {
                loginSec.style.display = 'block';
                regSec.style.display = 'none';
            }
        }

        function handleAnimLogin() {
            const username = document.getElementById('animLoginUser').value.trim();
            const password = document.getElementById('animLoginPass').value;

            if (!username || !password) {
                alert('Vui lòng điền đầy đủ thông tin!');
                return;
            }

            const user = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
            if (!user) {
                alert('Mật khẩu hoặc tên đăng nhập không đúng!');
                return;
            }

            currentUser = user;
            localStorage.setItem('ipad_current_user', JSON.stringify(currentUser));
            closeAnimatedAuthModal();
            updateAuthUI();
            renderGallery();
        }

        function handleAnimRegister() {
            const username = document.getElementById('animRegUser').value.trim();
            const email = document.getElementById('animRegEmail').value.trim();
            const password = document.getElementById('animRegPass').value;

            if (!username || !email || !password) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                alert('Tên tài khoản này đã tồn tại!');
                return;
            }

            users.push({ username, email, password });
            localStorage.setItem('ipad_users', JSON.stringify(users));
            alert('Đăng ký tài khoản thành công! Bạn có thể đăng nhập ngay.');
            switchAuthMode('login');
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('ipad_current_user');
            updateAuthUI();
            renderGallery();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeModalOnOutside(event, id) {
            if (event.target.id === id) closeModal(id);
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGallery();
        }

        function changeSortMethod() {
            currentSort = document.getElementById('sortSelect').value;
            currentPage = 1;
            renderGallery();
        }

        function saveDataAndRender() {
            localStorage.setItem('ipad_wallpapers', JSON.stringify(wallpapers));
            renderGallery();
            if (activeModalWallpaperId !== null) {
                openImageModal(activeModalWallpaperId);
            }
        }

        /* Hiển thị danh sách ảnh */
        function renderGallery() {
            const galleryEl = document.getElementById('gallery');
            const paginationEl = document.getElementById('pagination');
            galleryEl.innerHTML = '';
            paginationEl.innerHTML = '';

            let list = wallpapers.filter(wp => {
                if (!wp.category) wp.category = 'khac';
                return currentCategory === 'all' || wp.category === currentCategory;
            });

            if (currentSort === 'latest') {
                list.sort((a, b) => b.id - a.id);
            } else if (currentSort === 'oldest') {
                list.sort((a, b) => a.id - b.id);
            } else if (currentSort === 'trending') {
                list.sort((a, b) => b.likes - a.likes);
            }

            const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * itemsPerPage;
            const paginatedList = list.slice(start, start + itemsPerPage);

            paginatedList.forEach((wp) => {
                if (!wp.likedBy) wp.likedBy = [];
                if (!wp.tags) wp.tags = {};
                const isLiked = currentUser && wp.likedBy.includes(currentUser.username);

                let sortedTags = Object.entries(wp.tags).sort((a, b) => b[1].count - a[1].count).slice(0, 2);

                let tagsHtml = '';
                sortedTags.forEach(([tagName, tagData]) => {
                    tagsHtml += `<span class="mini-tag">#${tagName} (${tagData.count})</span>`;
                });

                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                card.innerHTML = `
                    <img src="${wp.url}" alt="${wp.title}" loading="lazy">
                    <div class="wallpaper-info">
                        <div class="card-header-row">
                            <span class="wallpaper-title" title="${wp.title}">${wp.title}</span>
                            <div class="actions">
                                <button class="like-btn" onclick="toggleLike(${wp.id}, event)">
                                    ${isLiked ? '❤️' : '🤍'} ${wp.likes}
                                </button>
                                <a href="${wp.url}" target="_blank" download class="download-btn" onclick="event.stopPropagation()">Tải về</a>
                            </div>
                        </div>
                        <div class="preview-tags">${tagsHtml}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    openImageModal(wp.id);
                });

                galleryEl.appendChild(card);
            });

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => {
                    currentPage = i;
                    renderGallery();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginationEl.appendChild(pageBtn);
            }
        }

        /* Modal Chi tiết & Hashtag */
        function openImageModal(id) {
            activeModalWallpaperId = id;
            const wp = wallpapers.find(item => item.id === id);
            if (!wp) return;

            document.getElementById('modalImg').src = wp.url;
            document.getElementById('modalTitle').textContent = wp.title;
            
            renderModalReactionTags(wp);
            document.getElementById('addTagInputBox').style.display = 'none';
            openModal('imageModal');
        }

        function renderModalReactionTags(wp) {
            const container = document.getElementById('modalReactionContainer');
            container.innerHTML = '';

            if (!wp.tags) wp.tags = {};

            let sortedTags = Object.entries(wp.tags).sort((a, b) => b[1].count - a[1].count);

            sortedTags.forEach(([tagName, tagData]) => {
                if (!tagData.users) tagData.users = [];
                const hasReacted = currentUser && tagData.users.includes(currentUser.username);

                const tagEl = document.createElement('div');
                tagEl.className = `reaction-tag ${hasReacted ? 'reacted' : ''}`;
                tagEl.innerHTML = `#${tagName} <span>${tagData.count}</span>`;
                tagEl.onclick = () => toggleTagReaction(wp.id, tagName);
                container.appendChild(tagEl);
            });

            const addTrigger = document.createElement('div');
            addTrigger.className = 'add-tag-trigger';
            addTrigger.innerHTML = '#';
            addTrigger.title = 'Thêm hashtag mới';
            addTrigger.onclick = () => {
                const box = document.getElementById('addTagInputBox');
                box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
            };
            container.appendChild(addTrigger);
        }

        function toggleTagReaction(wallpaperId, tagName) {
            if (!currentUser) {
                alert('Vui lòng đăng nhập để tương tác hashtag!');
                openAnimatedAuthModal('login');
                return;
            }

            const wp = wallpapers.find(item => item.id === wallpaperId);
            if (wp && wp.tags[tagName]) {
                if (!wp.tags[tagName].users) wp.tags[tagName].users = [];
                let userIndex = wp.tags[tagName].users.indexOf(currentUser.username);

                if (userIndex > -1) {
                    wp.tags[tagName].users.splice(userIndex, 1);
                    wp.tags[tagName].count -= 1;
                    if (wp.tags[tagName].count <= 0) {
                        delete wp.tags[tagName];
                    }
                } else {
                    wp.tags[tagName].users.push(currentUser.username);
                    wp.tags[tagName].count += 1;
                }
                saveDataAndRender();
            }
        }

        function submitNewTag() {
            if (!currentUser) {
                alert('Vui lòng đăng nhập để thêm hashtag!');
                openAnimatedAuthModal('login');
                return;
            }

            let inputVal = document.getElementById('newTagInput').value.trim().toLowerCase();
            inputVal = inputVal.replace(/^#/, '');

            if (!inputVal) {
                alert('Vui lòng nhập tên hashtag hợp lệ!');
                return;
            }

            const wp = wallpapers.find(item => item.id === activeModalWallpaperId);
            if (wp) {
                if (!wp.tags) wp.tags = {};

                if (wp.tags[inputVal]) {
                    toggleTagReaction(wp.id, inputVal);
                } else {
                    wp.tags[inputVal] = {
                        count: 1,
                        users: [currentUser.username]
                    };
                    saveDataAndRender();
                }
                document.getElementById('newTagInput').value = '';
                document.getElementById('addTagInputBox').style.display = 'none';
            }
        }

        function toggleLike(id, event) {
            event.stopPropagation();
            if (!currentUser) {
                alert('Vui lòng đăng nhập để thả tim!');
                openAnimatedAuthModal('login');
                return;
            }

            const wp = wallpapers.find(item => item.id === id);
            if (wp) {
                if (!wp.likedBy) wp.likedBy = [];
                const index = wp.likedBy.indexOf(currentUser.username);

                if (index > -1) {
                    wp.likedBy.splice(index, 1);
                    wp.likes -= 1;
                } else {
                    wp.likedBy.push(currentUser.username);
                    wp.likes += 1;
                }
                saveDataAndRender();
            }
        }

        /* Đăng hình ảnh mới */
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentUser) {
                alert('Vui lòng đăng nhập để tải ảnh lên!');
                openAnimatedAuthModal('login');
                return;
            }

            const title = document.getElementById('imageTitle').value;
            const category = document.getElementById('imageCategory').value;
            const fileInput = document.getElementById('imageFile');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    wallpapers.push({
                        id: Date.now(),
                        title,
                        category,
                        url: e.target.result,
                        likes: 0,
                        likedBy: [],
                        tags: { "ipad": {count: 1, users: [currentUser.username]} }
                    });
                    saveDataAndRender();
                    document.getElementById('uploadForm').reset();
                    alert('Đăng ảnh thành công!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        });

        // Khởi tạo trang
        updateAuthUI();
        renderGallery();
    </script>
</body>
</html>
