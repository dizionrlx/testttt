<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Wallpapers - Playground</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1115;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #9ca3af;
            font-size: 1.1rem;
        }

        /* Khu vực đăng hình (Upload Section) */
        .upload-section {
            background-color: #1f2937;
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 2px dashed #374151;
            text-align: center;
        }

        .upload-section h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #f3f4f6;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upload-form input[type="text"],
        .upload-form input[type="file"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background-color: #111827;
            color: #f3f4f6;
            font-size: 0.95rem;
        }

        .upload-form input[type="file"] {
            cursor: pointer;
        }

        .submit-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #059669;
        }

        /* Nút chuyển tab (Mới nhất / Nhiều yêu thích nhất) */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background-color: #1f2937;
            color: #9ca3af;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background-color: #3b82f6;
            color: white;
        }

        /* Lưới hiển thị hình nền */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .wallpaper-card {
            background-color: #1f2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .wallpaper-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .wallpaper-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
        }

        .wallpaper-info {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallpaper-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.1s;
        }

        .like-btn:active {
            transform: scale(1.2);
        }

        .download-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #2563eb;
        }

        /* Modal khi bấm vào ảnh */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>iPad Wallpapers Playground</h1>
        <p>Tuyển tập hình nền chất lượng cao thiết kế riêng cho màn hình iPad của bạn.</p>
    </header>

    <div class="upload-section">
        <h3>Chia sẻ hình nền mới của bạn</h3>
        <form class="upload-form" id="uploadForm">
            <input type="text" id="imageTitle" placeholder="Nhập tên hình nền..." required>
            <input type="file" id="imageFile" accept="image/png, image/jpeg, image/webp" required>
            <button type="submit" class="submit-btn">Đăng lên kho lưu trữ</button>
        </form>
    </div>

    <div class="nav-buttons">
        <button class="nav-btn active" id="btnLatest" onclick="switchTab('latest')">Mới nhất</button>
        <button class="nav-btn" id="btnTrending" onclick="switchTab('trending')">🔥 Nhiều yêu thích nhất</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="modal" id="imageModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <img id="modalImg" src="" alt="Full Wallpaper">
    </div>

    <script>
        // Lấy dữ liệu từ localStorage (lưu vĩnh viễn trên trình duyệt), nếu chưa có thì dùng danh sách mặc định
        let wallpapers = JSON.parse(localStorage.getItem('ipad_wallpapers')) || [
            { id: 1, title: "Abstract Gradient 01", url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80", likes: 3 },
            { id: 2, title: "Minimalist Mountains", url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80", likes: 8 },
            { id: 3, title: "Dark Neon Wave", url: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1200&q=80", likes: 5 },
            { id: 4, title: "Cosmic Nebula", url: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1200&q=80", likes: 10 },
            { id: 5, title: "Architectural Lines", url: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80", likes: 2 },
            { id: 6, title: "Sunset Horizon", url: "https://images.unsplash.com/photo-1495954484750-af469f2f9be5?auto=format&fit=crop&w=1200&q=80", likes: 7 },
            { id: 7, title: "Fluid 3D Art", url: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=1200&q=80", likes: 4 },
            { id: 8, title: "Misty Pine Forest", url: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80", likes: 9 },
            { id: 9, title: "Cyberpunk City", url: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1200&q=80", likes: 6 },
            { id: 10, title: "Soft Pastel Dream", url: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1200&q=80", likes: 11 }
        ];

        let currentTab = 'latest'; // Tab hiện tại: 'latest' hoặc 'trending'

        const galleryEl = document.getElementById('gallery');
        const modalEl = document.getElementById('imageModal');
        const modalImgEl = document.getElementById('modalImg');
        const closeModalEl = document.getElementById('closeModal');
        const uploadForm = document.getElementById('uploadForm');

        // Hàm lưu vào localStorage và render lại giao diện
        function saveDataAndRender() {
            localStorage.setItem('ipad_wallpapers', JSON.stringify(wallpapers));
            renderGallery();
        }

        // Hàm vẽ danh sách hình nền lên giao diện
        function renderGallery() {
            galleryEl.innerHTML = '';

            // Sắp xếp danh sách dựa theo tab đang chọn
            let displayList = [...wallpapers];
            if (currentTab === 'trending') {
                displayList.sort((a, b) => b.likes - a.likes); // Sắp xếp nhiều tim nhất lên đầu
            } else {
                displayList.reverse(); // Đảo ngược để ảnh mới đăng lên đầu
            }

            displayList.forEach((wp) => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                
                card.innerHTML = `
                    <img src="${wp.url}" alt="${wp.title}" loading="lazy">
                    <div class="wallpaper-info">
                        <span class="wallpaper-title" title="${wp.title}">${wp.title}</span>
                        <div class="actions">
                            <button class="like-btn" onclick="likeWallpaper(${wp.id}, event)">❤️ ${wp.likes}</button>
                            <a href="${wp.url}" target="_blank" download class="download-btn" onclick="event.stopPropagation()">Tải về</a>
                        </div>
                    </div>
                `;

                // Bấm vào thẻ để phóng to ảnh
                card.addEventListener('click', () => {
                    modalImgEl.src = wp.url;
                    modalEl.style.display = 'flex';
                });

                galleryEl.appendChild(card);
            });
        }

        // Chuyển đổi qua lại giữa tab Mới nhất và Nhiều yêu thích nhất
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btnLatest').classList.toggle('active', tab === 'latest');
            document.getElementById('btnTrending').classList.toggle('active', tab === 'trending');
            renderGallery();
        }

        // Hàm tăng lượt thích (Thả tim)
        function likeWallpaper(id, event) {
            event.stopPropagation(); // Ngăn không cho bật modal ảnh lớn khi bấm tim
            const wp = wallpapers.find(item => item.id === id);
            if (wp) {
                wp.likes += 1;
                saveDataAndRender();
            }
        }

        // Chạy lần đầu tiên khi mở trang
        renderGallery();

        // Xử lý sự kiện khi người dùng nhấn nút "Đăng lên kho lưu trữ"
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const titleInput = document.getElementById('imageTitle');
            const fileInput = document.getElementById('imageFile');

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];

                // KIỂM DUYỆT 1: Chỉ cho phép định dạng ảnh chuẩn cho iPad (JPG, PNG, WEBP)
                const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];
                if (!allowedTypes.includes(file.type)) {
                    alert('Lỗi kiểm duyệt: Chỉ chấp nhận định dạng hình nền chuẩn cho iPad (JPG, PNG, WEBP)!');
                    return;
                }

                const reader = new FileReader();
                
                reader.onload = function(e) {
                    // Thêm ảnh mới vào mảng dữ liệu
                    const newWallpaper = {
                        id: Date.now(),
                        title: titleInput.value,
                        url: e.target.result, // Chuyển file ảnh thành chuỗi Base64
                        likes: 0
                    };

                    wallpapers.push(newWallpaper);

                    // Lưu vĩnh viễn và cập nhật lại giao diện
                    saveDataAndRender();

                    // Reset form sau khi đăng thành công
                    uploadForm.reset();
                    alert('Đăng ảnh thành công! Ảnh đã được lưu vĩnh viễn trên trình duyệt.');
                }

                reader.readAsDataURL(file);
            }
        });

        // Đóng modal
        closeModalEl.addEventListener('click', () => {
            modalEl.style.display = 'none';
        });

        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) {
                modalEl.style.display = 'none';
            }
        });
    </script>
</body>
</html>
