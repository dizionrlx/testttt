<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Wallpapers - Playground</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --text-color: #f3f4f6;
            --card-bg: #1f2937;
            --card-border: #374151;
            --input-bg: #111827;
            --text-secondary: #9ca3af;
            --title-color: #e5e7eb;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --input-bg: #f1f5f9;
            --text-secondary: #64748b;
            --title-color: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 40px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .auth-bar {
            max-width: 600px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            align-items: center;
        }

        .auth-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
        }

        .auth-btn.logout { background-color: #dc2626; color: white; border: none; }

        .upload-section {
            background-color: var(--card-bg);
            max-width: 600px;
            margin: 0 auto 25px auto;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 2px dashed var(--card-border);
            text-align: center;
        }

        .upload-section h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upload-form input[type="text"],
        .upload-form select,
        .upload-form input[type="file"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .submit-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover { background-color: #059669; }

        .filter-sort-bar {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .category-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
        }

        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .sort-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .wallpaper-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .wallpaper-card:hover { transform: translateY(-5px); }

        .wallpaper-card img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            display: block;
        }

        .wallpaper-info {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallpaper-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--title-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .like-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .like-btn.liked { color: #ff3b30; }

        .download-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }

        .page-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .page-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal img.preview-img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .modal-content h2 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85rem; color: var(--text-secondary); }
        .form-group input { padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); background-color: var(--input-bg); color: var(--text-color); }
        .close-modal { position: absolute; top: 15px; right: 20px; color: var(--text-color); font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙 Chế độ</button>
        <h1>Kho Hình Nền iPad</h1>
        <p>Tuyển tập hình nền chất lượng cao thiết kế riêng cho màn hình iPad của bạn.</p>
    </header>

    <div class="auth-bar" id="authBar">
        <span id="userInfo" style="font-size: 0.95rem; color: #10b981; font-weight: 500; display: none;"></span>
        <button class="auth-btn" id="btnLoginOpen" onclick="openModal('loginModal')">Đăng nhập</button>
        <button class="auth-btn" id="btnRegisterOpen" onclick="openModal('registerModal')">Đăng ký</button>
        <button class="auth-btn logout" id="btnLogout" style="display: none;" onclick="logout()">Đăng xuất</button>
    </div>

    <div class="upload-section">
        <h3>Chia sẻ hình nền mới của bạn</h3>
        <form class="upload-form" id="uploadForm">
            <input type="text" id="imageTitle" placeholder="Nhập tên hình nền..." required>
            <select id="imageCategory" required>
                <option value="phong-canh">Phong cảnh</option>
                <option value="hien-dai">Hiện đại</option>
                <option value="truu-tuong">Trừu tượng</option>
                <option value="toi-gian">Tối giản</option>
            </select>
            <input type="file" id="imageFile" accept="image/png, image/jpeg, image/webp" required>
            <button type="submit" class="submit-btn">Đăng lên kho lưu trữ</button>
        </form>
    </div>

    <!-- KHU VỰC BỘ LỌC DANH MỤC VÀ SẮP XẾP -->
    <div class="filter-sort-bar">
        <div class="category-filters">
            <button class="filter-btn active" onclick="filterCategory('all', this)">Tất cả</button>
            <button class="filter-btn" onclick="filterCategory('phong-canh', this)">Phong cảnh</button>
            <button class="filter-btn" onclick="filterCategory('hien-dai', this)">Hiện đại</button>
            <button class="filter-btn" onclick="filterCategory('truu-tuong', this)">Trừu tượng</button>
            <button class="filter-btn" onclick="filterCategory('toi-gian', this)">Tối giản</button>
        </div>
        <select class="sort-select" id="sortSelect" onchange="changeSortMethod()">
            <option value="latest">Mới nhất</option>
            <option value="oldest">Cũ nhất</option>
            <option value="trending">🔥 Nhiều yêu thích nhất</option>
        </select>
    </div>

    <div class="gallery" id="gallery"></div>
    <div class="pagination" id="pagination"></div>

    <!-- MODAL XEM ẢNH -->
    <div class="modal" id="imageModal" onclick="closeModal('imageModal')">
        <span class="close-modal">&times;</span>
        <img class="preview-img" id="modalImg" src="" alt="Full Wallpaper">
    </div>

    <!-- MODAL ĐĂNG KÝ -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('registerModal')">&times;</span>
            <h2>Đăng ký tài khoản</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group"><label>Tên người dùng</label><input type="text" id="regUsername" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
                <div class="form-group"><label>Mật khẩu</label><input type="password" id="regPassword" required></div>
                <button type="submit" class="submit-btn" style="width: 100%;">Đăng ký</button>
            </form>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
            <h2>Đăng nhập</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group"><label>Tên người dùng</label><input type="text" id="loginUsername" required></div>
                <div class="form-group"><label>Mật khẩu</label><input type="password" id="loginPassword" required></div>
                <button type="submit" class="submit-btn" style="width: 100%;">Đăng nhập</button>
            </form>
        </div>
    </div>

            { id: 29, title: "Kết cấu vàng óng ánh", category: "truu-tuong", url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80", likes: 11, likedBy: [] },
            { id: 30, title: "Góc làm việc ngăn nắp", category: "toi-gian", url: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=1200&q=80", likes: 9, likedBy: [] }
        ];

        let currentCategory = 'all';
        let currentSort = 'latest';
        let currentPage = 1;
        const itemsPerPage = 12;

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('ipad_theme', newTheme);
        }

        const savedTheme = localStorage.getItem('ipad_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function updateAuthUI() {
            const userInfoEl = document.getElementById('userInfo');
            const btnLoginOpen = document.getElementById('btnLoginOpen');
            const btnRegisterOpen = document.getElementById('btnRegisterOpen');
            const btnLogout = document.getElementById('btnLogout');

            if (currentUser) {
                userInfoEl.textContent = `Xin chào, ${currentUser.username}`;
                userInfoEl.style.display = 'inline';
                btnLoginOpen.style.display = 'none';
                btnRegisterOpen.style.display = 'none';
                btnLogout.style.display = 'inline-block';
            } else {
                userInfoEl.style.display = 'none';
                btnLoginOpen.style.display = 'inline-block';
                btnRegisterOpen.style.display = 'inline-block';
                btnLogout.style.display = 'none';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                alert('Tên người dùng đã tồn tại!');
                return;
            }

            users.push({ username, email, password });
            localStorage.setItem('ipad_users', JSON.stringify(users));
            alert('Đăng ký thành công!');
            closeModal('registerModal');
            openModal('loginModal');
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const user = users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
            if (!user) {
                alert('Sai tài khoản hoặc mật khẩu!');
                return;
            }

            currentUser = user;
            localStorage.setItem('ipad_current_user', JSON.stringify(currentUser));
            closeModal('loginModal');
            updateAuthUI();
            renderGallery();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('ipad_current_user');
            updateAuthUI();
            renderGallery();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function filterCategory(category, btn) {
            currentCategory = category;
            currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGallery();
        }

        function changeSortMethod() {
            currentSort = document.getElementById('sortSelect').value;
            currentPage = 1;
            renderGallery();
        }

        function saveDataAndRender() {
            localStorage.setItem('ipad_wallpapers', JSON.stringify(wallpapers));
            renderGallery();
        }

        function renderGallery() {
            const galleryEl = document.getElementById('gallery');
            const paginationEl = document.getElementById('pagination');
            galleryEl.innerHTML = '';
            paginationEl.innerHTML = '';

            let list = wallpapers.filter(wp => {
                if (!wp.category) wp.category = 'khac';
                return currentCategory === 'all' || wp.category === currentCategory;
            });

            if (currentSort === 'latest') {
                list.sort((a, b) => b.id - a.id);
            } else if (currentSort === 'oldest') {
                list.sort((a, b) => a.id - b.id);
            } else if (currentSort === 'trending') {
                list.sort((a, b) => b.likes - a.likes);
            }

            const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * itemsPerPage;
            const paginatedList = list.slice(start, start + itemsPerPage);

            paginatedList.forEach((wp) => {
                if (!wp.likedBy) wp.likedBy = [];
                const isLiked = currentUser && wp.likedBy.includes(currentUser.username);

                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                card.innerHTML = `
                    <img src="${wp.url}" alt="${wp.title}" loading="lazy">
                    <div class="wallpaper-info">
                        <span class="wallpaper-title" title="${wp.title}">${wp.title}</span>
                        <div class="actions">
                            <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${wp.id}, event)">
                                ${isLiked ? '❤️' : '🤍'} ${wp.likes}
                            </button>
                            <a href="${wp.url}" target="_blank" download class="download-btn" onclick="event.stopPropagation()">Tải về</a>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    document.getElementById('modalImg').src = wp.url;
                    openModal('imageModal');
                });

                galleryEl.appendChild(card);
            });

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => {
                    currentPage = i;
                    renderGallery();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginationEl.appendChild(pageBtn);
            }
        }

        function toggleLike(id, event) {
            event.stopPropagation();
            if (!currentUser) {
                alert('Vui lòng đăng nhập để thả tim!');
                openModal('loginModal');
                return;
            }

            const wp = wallpapers.find(item => item.id === id);
            if (wp) {
                if (!wp.likedBy) wp.likedBy = [];
                const index = wp.likedBy.indexOf(currentUser.username);

                if (index > -1) {
                    wp.likedBy.splice(index, 1);
                    wp.likes -= 1;
                } else {
                    wp.likedBy.push(currentUser.username);
                    wp.likes += 1;
                }
                saveDataAndRender();
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentUser) {
                alert('Vui lòng đăng nhập để đăng ảnh!');
                openModal('loginModal');
                return;
            }

            const title = document.getElementById('imageTitle').value;
            const category = document.getElementById('imageCategory').value;
            const fileInput = document.getElementById('imageFile');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    wallpapers.push({
                        id: Date.now(),
                        title,
                        category,
                        url: e.target.result,
                        likes: 0,
                        likedBy: []
                    });
                    saveDataAndRender();
                    document.getElementById('uploadForm').reset();
                    alert('Đăng ảnh thành công!');
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        });

        updateAuthUI();
        renderGallery();
    </script>
</body>
</html>
